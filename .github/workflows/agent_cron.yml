name: Autonomous Agent Cron Loop

on:
  schedule:
    # Runs automatically every 30 minutes
    - cron: '*/30 * * * *'
  # Allows manual triggering directly from GitHub Actions UI
  workflow_dispatch:

# Enforce sequential execution: prevent overlapping runs from mutating state simultaneously
concurrency:
  group: agent-loop
  cancel-in-progress: false

jobs:
  run-agent:
    name: Execute Autonomous Agent Loop
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: ''  # Caching explicitly disabled to avoid persistent disk accumulation

      - name: Run Autonomous Agent Core
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CUSTOM_GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          python agent_core.py
